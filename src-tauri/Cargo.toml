[package]
name = "besiege-aero-analyzer"
version = "0.5.0"
description = "Local engineering analysis for Besiege aerodynamic blade machines"
authors = ["Besiege Aero Analyzer contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "besiege_aero_analyzer_lib"
# This package is distributed as a Windows desktop application.  The binary in
# `src/main.rs` links this library directly, so the extra mobile-oriented
# staticlib/cdylib outputs only multiply Cargo artifacts without being bundled.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
