[package]
name = "besiege-aero-analyzer"
version = "0.5.0"
description = "Local engineering analysis for Besiege aerodynamic blade machines"
authors = ["Besiege Aero Analyzer contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "besiege_aero_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
